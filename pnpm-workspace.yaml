packages:
  - "apps/*"
  - "packages/*"
catalog:
  '@ai-sdk/anthropic': ^4.0.74
  '@ai-sdk/deepseek': ^3.0.61
  '@ai-sdk/google': ^4.0.90
  '@ai-sdk/mistral': ^4.0.59
  '@ai-sdk/openai': ^4.0.86
  '@openrouter/ai-sdk-provider': ^3.1.0
  ai: ^7.0.130
allowBuilds:
  '@clerk/shared': false
  esbuild: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.53 || 4.0.74'
  - '@ai-sdk/google@4.0.45'
  - ai@7.0.67 || 7.0.92
overrides:
  fast-uri: 3.1.6
  js-yaml: 4.3.2
  morgan: '>=1.12.0'
  prismjs: '>=1.30.0'
  qs: 6.16.0
  uuid: '>=11.1.1'

# apps/** packages/** means "all subdirectories" resulting in next error. Once an app has built, your workspace declaration is picking up apps/docs/.next as a workspace.
