packages:
  - "apps/*"
  - "packages/*"
catalog:
  '@ai-sdk/anthropic': ^4.0.82
  '@ai-sdk/deepseek': ^3.0.67
  '@ai-sdk/google': ^4.0.99
  '@ai-sdk/mistral': ^4.0.66
  '@ai-sdk/openai': ^4.0.96
  '@openrouter/ai-sdk-provider': ^3.1.0
  ai: ^7.0.143
allowBuilds:
  '@clerk/shared': false
  esbuild: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.53 || 4.0.74'
  - '@ai-sdk/google@4.0.45'
  - ai@7.0.67 || 7.0.92
  - '@ai-sdk/anthropic@4.0.82'
  - '@ai-sdk/deepseek@3.0.67'
  - '@ai-sdk/gateway@4.0.116'
  - '@ai-sdk/google@4.0.99'
  - '@ai-sdk/mistral@4.0.66'
  - '@ai-sdk/openai@4.0.96'
  - '@ai-sdk/provider-utils@5.0.62'
  - '@ai-sdk/provider@4.0.29'
  - ai@7.0.143
  # Security patches newer than the release-age window (Dependabot alerts 289-294).
  - body-parser@2.4.0
  - serialize-javascript@7.1.3
  - fast-uri@3.1.9
overrides:
  brace-expansion@2: '>=2.1.7'
  brace-expansion@5: '>=5.0.12'
  recharts>react-is: 19.3.0
  fast-uri: 3.1.9
  body-parser@2: 2.4.0
  serialize-javascript: 7.1.3
  follow-redirects: '>=1.16.1 <2'
  undici@7: '>=7.30.1 <8'
  undici@8: '>=8.12.2 <9'
  js-yaml: 4.3.2
  morgan: '>=1.12.0'
  prismjs: '>=1.30.0'
  qs: 6.16.0
  uuid: '>=11.1.1'

# apps/** packages/** means "all subdirectories" resulting in next error. Once an app has built, your workspace declaration is picking up apps/docs/.next as a workspace.
