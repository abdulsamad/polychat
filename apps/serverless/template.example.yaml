AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless Example

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      FunctionName: ExampleFunction
      Handler: dist/index.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      Timeout: 60
      MemorySize: 128
      ReservedConcurrentExecutions: 5
      EphemeralStorage:
        Size: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          PORT: !Ref PORT
          CLERK_ISSUER_BASE_URL: !Ref ClerkIssuerBaseURL
          CLERK_AUTHORIZED_PARTIES: !Ref ClerkAuthorizedParties
          LAMBDA_PROXY_SECRET: !Ref LambdaProxySecret
          GEMINI_API_KEY: !Ref GeminiAPIKey
          OPENAI_API_KEY: !Ref OpenAIAPIKey
          ANTHROPIC_API_KEY: !Ref AnthropicAPIKey
          MISTRAL_API_KEY: !Ref MistralAPIKey
          DEEPSEEK_API_KEY: !Ref DeepSeekAPIKey
          OPENROUTER_API_KEY: !Ref OpenRouterAPIKey
    Metadata:
      BuildMethod: esbuild

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      Cors:
        AllowOrigins: !Split [",", !Ref AllowedOrigins]
        AllowMethods:
          - POST
          - GET
        AllowHeaders:
          - "Content-Type"
          - "Authorization"
        MaxAge: 60
      InvokeMode: RESPONSE_STREAM
      TargetFunctionArn: !GetAtt ApiFunction.Arn

  ApiFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ExampleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/ExampleFunction
      RetentionInDays: 30

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchAlarms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:ListMetrics
                Resource:
                  - !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm/ExampleHighInvocation"
                  - !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm/ExampleHighErrorRate"

  LambdaInvocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: LambdaHighInvocation
      AlarmDescription: "Trigger alarm if the function is invoked more than 1000 times within 5 minutes to prevent abuse."
      MetricName: Invocations
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:LambdaAlertTopic"
      Dimensions:
        - Name: ExampleFunction
          Value: !Ref ApiFunction

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: LambdaHighErrorRate
      AlarmDescription: "Trigger alarm if error rate exceeds 5% of invocations."
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:LambdaAlertTopic"
      Dimensions:
        - Name: ExampleFunction
          Value: !Ref ApiFunction

  LambdaAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: LambdaAlertTopic

Parameters:
  PORT:
    Type: String
    Default: "3001"
  AllowedOrigins:
    Type: String
    AllowedPattern: '^(https://[^, ]+|http://localhost(:[0-9]+)?)(,(https://[^, ]+|http://localhost(:[0-9]+)?))*$'
    ConstraintDescription: Origins must use HTTPS, except for localhost HTTP origins; wildcard origins are not allowed.
  ClerkIssuerBaseURL:
    Type: String
  ClerkAuthorizedParties:
    Type: String
  LambdaProxySecret:
    Type: String
    NoEcho: true
  GeminiAPIKey:
    Type: String
    NoEcho: true
  OpenAIAPIKey:
    Type: String
    NoEcho: true
  AnthropicAPIKey:
    Type: String
    NoEcho: true
  MistralAPIKey:
    Type: String
    NoEcho: true
  DeepSeekAPIKey:
    Type: String
    NoEcho: true
  OpenRouterAPIKey:
    Type: String
    NoEcho: true

Outputs:
  FunctionUrl:
    Description: URL of the Lambda function
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
